# Generated by Oryn from a local profile. Edit it in the app; manual changes are overwritten.
oryn-version: 1
mode: "rule"
log-level: "info"

dns:
  enhanced-mode: "fake-ip"
  fake-ip-filter-mode: "blacklist"
  reject-response: "refused"

proxies:
  - name: "A#1, special"
    type: "trojan"
    server: "a.example.com"
    port: 443
    password: "123456"
    udp: true
    sni: "a.example.com"
  - name: "B"
    type: "vmess"
    server: "b.example.com"
    port: 8443
    uuid: "11111111-2222-3333-4444-555555555555"
    cipher: "auto"
    alterId: 0
    global-padding: false
    authenticated-length: false
    udp: true
    skip-cert-verify: false
  - name: "C"
    type: "ss"
    server: "c.example.com"
    port: 8388
    cipher: "chacha20-ietf-poly1305"
    password: "123456"
    udp: true
  - name: "D"
    type: "trojan"
    server: "a.example.com"
    port: 443
    password: "123456"
    udp: true

proxy-providers:
  provider-a:
    type: "inline"
    payload:
      - name: "P1"
        type: "socks5"
        server: "9.9.9.9"
        port: 1080

proxy-groups:
  - name: "Pick"
    type: "select"
    proxies:
      - "A#1, special"
      - "B"
      - "C"
  - name: "AutoAll"
    type: "url-test"
    proxies:
      - "A#1, special"
      - "B"
      - "C"
    use:
      - "provider-a"
  - name: "Nested"
    type: "select"
    proxies:
      - "Pick"
      - "AutoAll"
      - "DIRECT"
    flatten: true

rules:
  - "DOMAIN-SUFFIX,example.com,Pick"
  - "MATCH,DIRECT"
