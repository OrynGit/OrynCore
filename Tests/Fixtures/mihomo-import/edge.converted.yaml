# Generated by Oryn from a local profile. Edit it in the app; manual changes are overwritten.
oryn-version: 1
mode: "rule"
log-level: "info"

dns:
  enhanced-mode: "fake-ip"
  fake-ip-filter-mode: "blacklist"
  reject-response: "refused"

proxies:
  - name: "Snell"
    type: "snell"
    server: "s.example.com"
    port: 443
    psk: "abc"
    version: 4
  - name: "Plain"
    type: "socks5"
    server: "1.2.3.4"
    port: 1080
    udp: false
  - name: "Hop"
    type: "http"
    server: "1.2.3.5"
    port: 8080
    dialer-proxy: "Plain"

proxy-groups:
  - name: "GLOBAL"
    type: "select"
    proxies:
      - "Plain"
      - "Hop"
      - "DIRECT"
  - name: "Empty"
    type: "select"

rules:
  - "DOMAIN,x.example.com,GLOBAL"
  - "DOMAIN-SUFFIX,example.org,PASS"
  - "DOMAIN-SUFFIX,example.io,REJECT-DROP"
  - "DOMAIN-SUFFIX,example.dev,Empty"
  - "MATCH,DIRECT"
