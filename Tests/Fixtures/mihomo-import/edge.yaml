# 无 MATCH、保留名称、被忽略的类型与带 Oryn 扩展的写法
proxies:
  - {name: Snell, type: snell, server: s.example.com, port: 443, psk: abc, version: 4}
  - {name: Plain, type: socks5, server: 1.2.3.4, port: 1080}
  - {name: Hop, type: http, server: 1.2.3.5, port: 8080, dialer-proxy: Plain}

proxy-groups:
  - name: GLOBAL
    type: select
    proxies: [Plain, Hop, DIRECT]
  - name: Empty
    type: select
    proxies: []

rules:
  - DOMAIN,x.example.com,GLOBAL
  - DOMAIN-SUFFIX,example.org,PASS
  - DOMAIN-SUFFIX,example.io,REJECT-DROP
  - DOMAIN-SUFFIX,example.dev,Empty
  - bad rule
