# Generated by Oryn from a local profile. Edit it in the app; manual changes are overwritten.
oryn-version: 1
mode: "rule"
log-level: "info"

dns:
  enhanced-mode: "fake-ip"
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "*.home.arpa"
    - "captive.apple.com"
    - "time.apple.com"
    - "time.*.com"
    - "+.pool.ntp.org"
    - "+.stun.*.*"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
  fake-ip-filter-mode: "blacklist"
  default-nameserver:
    - "119.29.29.29"
    - "223.5.5.5"
  nameserver:
    - "8.8.8.8"
    - "1.1.1.1"
    - "9.9.9.9"
  reject-response: "refused"

proxies:
  - name: "Tailnet"
    type: "tailscale"
    oryn-tailscale-enabled: false
    hostname: "oryn"
    auth-key: "tskey-auth-fixture"
    state-dir: "tailscale"
    ephemeral: false
    udp: false

proxy-groups:
  - name: "Proxy"
    type: "select"
    proxies:
      - "Tailnet"
      - "DIRECT"

rules:
  - "MATCH,DIRECT"

sniffer:
  enable: true
