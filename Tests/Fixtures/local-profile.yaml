# Generated by Oryn from a local profile. Edit it in the app; manual changes are overwritten.
oryn-version: 1
mode: "rule"
log-level: "debug"

hosts:
  router.lan: "192.168.1.1"
  "*.multi.example":
    - "1.2.3.4"
    - "5.6.7.8"

dns:
  enhanced-mode: "fake-ip"
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "*.home.arpa"
    - "captive.apple.com"
    - "time.apple.com"
    - "time.*.com"
    - "+.pool.ntp.org"
    - "+.stun.*.*"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
  fake-ip-filter-mode: "blacklist"
  default-nameserver:
    - "119.29.29.29"
    - "223.5.5.5"
  nameserver:
    - "8.8.8.8"
    - "1.1.1.1"
    - "9.9.9.9"
  proxy-server-nameserver:
    - "tls://223.5.5.5"
  upstreams:
    Domestic-DNS:
      - "https://doh.pub/dns-query"
      - "223.5.5.5"
  forward-rules:
    - "DOMAIN-SUFFIX,chaoxing.com,119.29.29.29"
    - "SSID,Home*,Domestic-DNS"
    - "CELLULAR,*,Domestic-DNS"
  blocked-ips:
    - "0.0.0.0"
  public-ip-url: "https://ifconfig.me/ip"
  reject-response: "nxdomain"

proxies:
  - name: "Tokyo"
    type: "socks5"
    server: "1.2.3.4"
    port: 1080
    username: "user"
    password: "pa\"ss"
    udp: true
  - name: "Office"
    type: "http"
    server: "proxy.example.com"
    port: 8443
    tls: true
    sni: "proxy.example.com"
    client-fingerprint: "firefox"
  - name: "SS"
    type: "ss"
    server: "ss.example.com"
    port: 8388
    cipher: "2022-blake3-aes-128-gcm"
    password: "AAAAAAAAAAAAAAAAAAAAAA=="
    udp: true
  - name: "Trojan WS"
    type: "trojan"
    server: "cdn.example.com"
    port: 443
    password: "secret"
    udp: true
    sni: "cdn.example.com"
    alpn:
      - "http/1.1"
    network: "ws"
    ws-opts:
      path: "/ws"
      headers:
        Host: "cdn.example.com"
      max-early-data: 2048
      early-data-header-name: "X-Early-Data"
  - name: "VLESS"
    type: "vless"
    server: "5.6.7.8"
    port: 443
    uuid: "b831381d-6324-4d53-ad4f-8cda48b30811"
    udp: false
    tls: true
    servername: "vless.example.com"
    fingerprint: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    alpn:
      - "http/1.1"
    network: "ws"
    ws-opts:
      path: "/vl?ed=1024"
  - name: "Reality"
    type: "vless"
    server: "reality.example.com"
    port: 443
    uuid: "b831381d-6324-4d53-ad4f-8cda48b30811"
    udp: true
    tls: true
    servername: "cover.example.com"
    client-fingerprint: "chrome"
    reality-opts:
      public-key: "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8"
      short-id: "0123456789abcdef"
  - name: "VMess"
    type: "vmess"
    server: "vm.example.com"
    port: 443
    uuid: "b831381d-6324-4d53-ad4f-8cda48b30811"
    cipher: "aes-128-cfb"
    alterId: 64
    global-padding: true
    authenticated-length: true
    packet-encoding: "xudp"
    smux:
      enabled: true
      protocol: "yamux"
      max-connections: 4
      min-streams: 4
      max-streams: 32
      padding: true
      only-tcp: false
    udp: true
  - name: "gRPC"
    type: "vless"
    server: "grpc.example.com"
    port: 443
    uuid: "b831381d-6324-4d53-ad4f-8cda48b30811"
    udp: true
    tls: true
    alpn:
      - "h2"
    network: "grpc"
    grpc-opts:
      grpc-service-name: "service"
  - name: "HTTPUpgrade"
    type: "trojan"
    server: "cdn.example.com"
    port: 443
    password: "secret"
    udp: true
    sni: "cdn.example.com"
    alpn:
      - "http/1.1"
    network: "ws"
    ws-opts:
      path: "/ws"
      headers:
        Host: "cdn.example.com"
      max-early-data: 2048
      early-data-header-name: "X-Early-Data"
      v2ray-http-upgrade: true
  - name: "ShadowTLS"
    type: "ss"
    server: "shadow.example.com"
    port: 443
    cipher: "aes-128-gcm"
    password: "secret"
    plugin: "shadow-tls"
    plugin-opts:
      version: 3
      host: "cover.example.com"
      password: "cover-secret"
    smux:
      enabled: true
      protocol: "h2mux"
      max-connections: 4
      min-streams: 4
      max-streams: 32
      padding: false
      only-tcp: false
    udp: true
  - name: "AnyTLS"
    type: "anytls"
    server: "any.example.com"
    port: 443
    password: "secret"
    idle-session-check-interval: 10
    idle-session-timeout: 60
    min-idle-session: 1
    udp: true
    tls: true
  - name: "HTTP2"
    type: "vless"
    server: "h2.example.com"
    port: 443
    uuid: "b831381d-6324-4d53-ad4f-8cda48b30811"
    udp: true
    tls: true
    servername: "h2.example.com"
    alpn:
      - "h2"
    network: "h2"
    h2-opts:
      host:
        - "cdn.example.com"
        - "alt.example.com"
      path: "/tun"
  - name: "HTTP Obfs"
    type: "vmess"
    server: "http.example.com"
    port: 80
    uuid: "b831381d-6324-4d53-ad4f-8cda48b30811"
    cipher: "auto"
    alterId: 0
    global-padding: false
    authenticated-length: false
    udp: true
    network: "http"
    http-opts:
      method: "POST"
      path:
        - "/obfs"
      headers:
        Host:
          - "cdn.example.com"
  - name: "QUIC"
    type: "trojan"
    server: "quic.example.com"
    port: 443
    password: "secret"
    udp: true
    alpn:
      - "h3"
    network: "quic"
  - name: "SS Obfs"
    type: "ss"
    server: "obfs.example.com"
    port: 80
    cipher: "aes-128-gcm"
    password: "secret"
    plugin: "obfs"
    plugin-opts:
      mode: "tls"
      host: "cover.example.com"
    udp: true
  - name: "SS V2Ray"
    type: "ss"
    server: "v2ray.example.com"
    port: 443
    cipher: "aes-128-gcm"
    password: "secret"
    plugin: "v2ray-plugin"
    plugin-opts:
      mode: "websocket"
      tls: true
      host: "cdn.example.com"
      path: "/ws"
      mux: true
    udp: true
  - name: "ShadowTLS v2"
    type: "ss"
    server: "shadow2.example.com"
    port: 443
    cipher: "aes-128-gcm"
    password: "secret"
    plugin: "shadow-tls"
    plugin-opts:
      version: 2
      host: "cover.example.com"
      password: "cover"
    udp: true
  - name: "SS UoT"
    type: "ss"
    server: "uot.example.com"
    port: 8388
    cipher: "aes-128-gcm"
    password: "secret"
    udp-over-tcp: true
    udp-over-tcp-version: 2
    udp: true
  - name: "Brutal"
    type: "trojan"
    server: "brutal.example.com"
    port: 443
    password: "secret"
    smux:
      enabled: true
      protocol: "smux"
      max-connections: 4
      min-streams: 4
      max-streams: 32
      padding: false
      only-tcp: false
      brutal-opts:
        enabled: true
        up: 50
        down: 200
    udp: true
  - name: "Chained"
    type: "socks5"
    server: "chain.example.com"
    port: 1080
    dialer-proxy: "Tokyo"
    udp: true
  - name: "WireGuard"
    type: "wireguard"
    private-key: "AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE="
    peers:
      - server: "wg1.example.com"
        port: 51820
        public-key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        allowed-ips:
          - "10.0.0.0/24"
      - server: "wg2.example.com"
        port: 51821
        public-key: "AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE="
        allowed-ips:
          - "10.0.1.0/24"
          - "192.168.0.0/16"
        reserved: "1,2,3"
    ip: "10.0.0.2"
    refresh-server-ip-interval: 300
    amnezia-wg-option:
      jc: 5
      jmin: 40
      jmax: 70
      s1: 0
      s2: 0
      h1: 100
      h2: 200
      h3: 300
      h4: 400
    udp: false
  - name: "Vision"
    type: "vless"
    server: "vision.example.com"
    port: 443
    uuid: "b831381d-6324-4d53-ad4f-8cda48b30811"
    flow: "xtls-rprx-vision"
    udp: true
    tls: true
  - name: "SS Gost"
    type: "ss"
    server: "gost.example.com"
    port: 443
    cipher: "xchacha20-ietf-poly1305"
    password: "secret"
    plugin: "gost-plugin"
    plugin-opts:
      mode: "websocket"
      tls: true
      path: "/ws"
      mux: true
    udp: true
  - name: "SSR"
    type: "ssr"
    server: "ssr.example.com"
    port: 8388
    cipher: "aes-256-cfb"
    password: "secret"
    protocol: "auth_aes128_md5"
    obfs: "http_simple"
    obfs-param: "cover.example"
    udp: true
  - name: "Snell"
    type: "snell"
    server: "snell.example.com"
    port: 443
    psk: "snell-psk"
    version: 6
    mode: "unshaped"
    reuse: true
    udp: true
  - name: "Naive"
    type: "naive"
    server: "naive.example.com"
    port: 443
    username: "user"
    password: "pass"
    udp-over-tcp-version: 2
    udp: true
    tls: true
    client-fingerprint: "chrome"
  - name: "SSH"
    type: "ssh"
    server: "ssh.example.com"
    port: 22
    username: "oryn"
    password: "secret"
    host-key:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA"
  - name: "Mieru"
    type: "mieru"
    server: "mieru.example.com"
    port-range: "4000-4010"
    username: "oryn"
    password: "secret"
    transport: "UDP"
    multiplexing: "MULTIPLEXING_HIGH"
    handshake-mode: "HANDSHAKE_NO_WAIT"
    traffic-pattern: "MgQIARAH"
    udp: true
  - name: "Sudoku"
    type: "sudoku"
    server: "sudoku.example.com"
    port: 443
    key: "sudoku-key"
    aead-method: "chacha20-poly1305"
    padding-min: 10
    padding-max: 30
    table-type: "up_ascii_down_entropy"
    enable-pure-downlink: false
    custom-tables:
      - "xpxvvpvv"
      - "ppvvxvvx"
    http-mask: true
    http-mask-mode: "stream"
    http-mask-tls: true
    http-mask-host: "cover.example.com"
    path-root: "oryn"
    multiplex: "on"
    udp: true
  - name: "ShadowQUIC"
    type: "shadowquic"
    server: "shadowquic.example.com"
    port: 443
    username: "oryn"
    password: "secret"
    sni: "cover.example.com"
    alpn:
      - "h3"
    udp-over-stream: true
    zero-rtt: true
    keep-alive-interval: 0
    congestion-controller: "cubic"
    cwnd: 32
    recv-window-conn: 0
    recv-window: 0
    max-open-streams: 32
    max-datagram-frame-size: 1400
    disable-mtu-discovery: false
    up: "50 Mbps"
    down: "100 Mbps"
    udp: true

proxy-groups:
  - name: "Proxy"
    type: "select"
    proxies:
      - "Tokyo"
      - "Office"
      - "SS"
      - "Trojan WS"
      - "VLESS"
      - "Reality"
      - "VMess"
      - "gRPC"
      - "HTTPUpgrade"
      - "ShadowTLS"
      - "AnyTLS"
      - "HTTP2"
      - "HTTP Obfs"
      - "QUIC"
      - "SS Obfs"
      - "SS V2Ray"
      - "ShadowTLS v2"
      - "SS UoT"
      - "Brutal"
      - "Chained"
      - "WireGuard"
      - "Vision"
      - "SS Gost"
      - "SSR"
      - "Snell"
      - "Naive"
      - "SSH"
      - "Mieru"
      - "Sudoku"
      - "ShadowQUIC"
      - "DIRECT"

rule-providers:
  rs-ea135320:
    type: "http"
    behavior: "domain"
    format: "text"
    url: "https://example.com/ads.txt"
    interval: 86400
  rs-7eaefcd5:
    type: "http"
    behavior: "classical"
    format: "yaml"
    url: "https://example.com/apple.yaml"
    interval: 86400

rules:
  - "DOMAIN-SUFFIX,google.com,Tokyo"
  - "DOMAIN-WILDCARD,*.example.org,Proxy"
  - "IP-CIDR,10.0.0.0/8,DIRECT,no-resolve"
  - "DST-PORT,8000-9000/8443,REJECT"
  - "GEOIP,CN,DIRECT"
  - "RULE-SET,rs-ea135320,REJECT"
  - "RULE-SET,rs-7eaefcd5,DIRECT"
  - "MATCH,Proxy"

sniffer:
  enable: true
