[package]
name = "oryn-ffi"
description = "OrynCore 的 C ABI，打包为 OrynCore.xcframework"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "oryncore"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
oryn-core.workspace = true
oryn-mitm.workspace = true
oryn-udp.workspace = true
base64.workspace = true
log.workspace = true
serde_json.workspace = true

[features]
# 全部协议默认编入（含 Extension 发布构建）；--no-default-features 为开发用精简版
default = ["hysteria2", "tuic", "wireguard", "quic"]
quic = ["oryn-core/quic"]
hysteria2 = ["oryn-core/hysteria2"]
tuic = ["oryn-core/tuic"]
wireguard = ["oryn-core/wireguard"]

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }
